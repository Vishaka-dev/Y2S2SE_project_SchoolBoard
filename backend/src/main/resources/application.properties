spring.application.name=SchoolBoard
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_board}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache / Redis
spring.cache.type=${SPRING_CACHE_TYPE:none}
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY:my-ultra-secret-and-very-long-key-for-jwt-signing-which-is-at-least-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OAuth2 Client Configuration - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Application Configuration
app.frontend-url=${SCHOOLBOARD_FRONTEND_URL:http://localhost:5173}
app.base-url=${APP_BASE_URL:http://localhost:8080}
server.port=${SERVER_PORT:8080}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/posts
file.profile-image-dir=uploads/profile-images
file.resource-dir=uploads/resources
app.upload-dir=uploads/messages
app.max-file-size=5242880
# Logging
logging.level.com.my_app.schoolboard=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

springdoc.swagger-ui.path=/api-docs
